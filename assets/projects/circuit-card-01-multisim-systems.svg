<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">电基础设计实验流程图</title>
  <desc id="desc">电基础设计实验中的 OCL 音频功率放大器仿真和交通信号灯控制器面包板复现流程图。</desc>
  <rect width="900" height="620" fill="#f8fafc"/>
  <rect x="44" y="42" width="812" height="536" rx="28" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="80" y="96" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">电基础设计实验</text>
  <text x="80" y="128" fill="#475569" font-family="Arial, sans-serif" font-size="16">模电功放设计 · 数电交通灯控制 · 面包板实物复现</text>

  <g font-family="Arial, sans-serif">
    <rect x="88" y="180" width="310" height="270" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="122" y="224" fill="#3730a3" font-size="22" font-weight="700">OCL 音频功率放大器</text>
    <line x1="122" y1="270" x2="175" y2="270" stroke="#3730a3" stroke-width="4"/>
    <path d="M175 270 C205 210 245 330 275 270 S335 270 355 270" fill="none" stroke="#3730a3" stroke-width="4"/>
    <text x="122" y="342" fill="#334155" font-size="15">输出功率 · 失真度 · 零点漂移</text>
    <text x="122" y="372" fill="#334155" font-size="15">负载阻抗：8Ω</text>
    <text x="122" y="402" fill="#334155" font-size="15">通频带：12.242Hz-25.176kHz</text>

    <rect x="502" y="180" width="310" height="270" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="536" y="224" fill="#047857" font-size="22" font-weight="700">交通信号灯控制器</text>
    <rect x="540" y="270" width="58" height="58" rx="8" fill="#d1fae5" stroke="#047857"/>
    <rect x="622" y="270" width="58" height="58" rx="8" fill="#d1fae5" stroke="#047857"/>
    <rect x="704" y="270" width="58" height="58" rx="8" fill="#d1fae5" stroke="#047857"/>
    <circle cx="569" cy="299" r="13" fill="#ef4444"/>
    <circle cx="651" cy="299" r="13" fill="#f59e0b"/>
    <circle cx="733" cy="299" r="13" fill="#22c55e"/>
    <path d="M568 328V370H734V328" fill="none" stroke="#047857" stroke-width="3"/>
    <text x="536" y="402" fill="#334155" font-size="15">74LS190 计数 · 74LS138 译码</text>
    <text x="536" y="432" fill="#334155" font-size="15">Multisim 仿真 → 面包板插线调试</text>

    <rect x="248" y="492" width="404" height="44" rx="22" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="276" y="520" fill="#92400e" font-size="16" font-weight="700">指标分解 → 参数计算 → 仿真验证 → 实物复现</text>
  </g>
</svg>
