<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">FPGA traffic signal controller workflow</title>
  <desc id="desc">A clean FPGA project diagram showing clock division, counter, LED display, seven-segment display and finite-state traffic signal control.</desc>
  <rect width="900" height="620" fill="#f8fafc"/>
  <rect x="44" y="42" width="812" height="536" rx="28" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="80" y="96" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">FPGA Traffic Signal Controller</text>
  <text x="80" y="128" fill="#475569" font-family="Arial, sans-serif" font-size="16">Vivado · Verilog HDL · finite-state control · seven-segment display</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="88" y="190" width="150" height="88" rx="16" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="120" y="228" fill="#075985" font-size="18" font-weight="700">Divider</text>
    <text x="118" y="254" fill="#075985">1kHz scan</text>
    <rect x="286" y="190" width="150" height="88" rx="16" fill="#ecfdf5" stroke="#34d399"/>
    <text x="318" y="228" fill="#047857" font-size="18" font-weight="700">Counter</text>
    <text x="312" y="254" fill="#047857">30s / 20s / 5s</text>
    <rect x="484" y="190" width="150" height="88" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="520" y="228" fill="#92400e" font-size="18" font-weight="700">FSM</text>
    <text x="510" y="254" fill="#92400e">4 states</text>
    <rect x="682" y="190" width="150" height="88" rx="16" fill="#fee2e2" stroke="#f87171"/>
    <text x="716" y="228" fill="#991b1b" font-size="18" font-weight="700">Outputs</text>
    <text x="708" y="254" fill="#991b1b">LED + display</text>
    <path d="M238 234H286" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M436 234H484" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M634 234H682" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="126" y="370" width="150" height="70" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="166" cy="405" r="14" fill="#ef4444"/>
    <circle cx="202" cy="405" r="14" fill="#f59e0b"/>
    <circle cx="238" cy="405" r="14" fill="#22c55e"/>
    <rect x="376" y="360" width="148" height="90" rx="12" fill="#0f172a"/>
    <text x="416" y="394" fill="#f8fafc" font-size="18" font-weight="700">30</text>
    <text x="416" y="428" fill="#f8fafc" font-size="18" font-weight="700">20</text>
    <rect x="624" y="370" width="150" height="70" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="660" y="412" fill="#334155" font-size="18" font-weight="700">Verilog RTL</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
