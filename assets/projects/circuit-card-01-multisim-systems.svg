<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Multisim analogue and digital circuit design workflow</title>
  <desc id="desc">A portfolio diagram summarising OCL audio power amplifier design and digital logic systems in NI Multisim.</desc>
  <rect width="900" height="620" fill="#f8fafc"/>
  <rect x="44" y="42" width="812" height="536" rx="28" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="80" y="96" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Multisim Circuit Design Practice</text>
  <text x="80" y="128" fill="#475569" font-family="Arial, sans-serif" font-size="16">Analogue amplifier · Digital logic · Simulation verification</text>
  <g font-family="Arial, sans-serif">
    <rect x="88" y="180" width="310" height="270" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="122" y="224" fill="#3730a3" font-size="22" font-weight="700">OCL Audio Amplifier</text>
    <line x1="122" y1="270" x2="175" y2="270" stroke="#3730a3" stroke-width="4"/>
    <path d="M175 270 C205 210 245 330 275 270 S335 270 355 270" fill="none" stroke="#3730a3" stroke-width="4"/>
    <text x="122" y="342" fill="#334155" font-size="15">Power output: 4.5W-8.9W</text>
    <text x="122" y="372" fill="#334155" font-size="15">Load: 8 ohm</text>
    <text x="122" y="402" fill="#334155" font-size="15">Frequency: 20Hz-20kHz</text>
    <rect x="502" y="180" width="310" height="270" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="536" y="224" fill="#047857" font-size="22" font-weight="700">Digital Logic Systems</text>
    <rect x="540" y="270" width="58" height="58" rx="8" fill="#d1fae5" stroke="#047857"/>
    <rect x="622" y="270" width="58" height="58" rx="8" fill="#d1fae5" stroke="#047857"/>
    <rect x="704" y="270" width="58" height="58" rx="8" fill="#d1fae5" stroke="#047857"/>
    <path d="M568 328V370H734V328" fill="none" stroke="#047857" stroke-width="3"/>
    <text x="536" y="402" fill="#334155" font-size="15">Digital clock · Frequency meter</text>
    <text x="536" y="432" fill="#334155" font-size="15">Responder · Traffic signal controller</text>
    <rect x="248" y="492" width="404" height="44" rx="22" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="302" y="520" fill="#92400e" font-size="16" font-weight="700">Specification → Calculation → Multisim Simulation → Report</text>
  </g>
</svg>
