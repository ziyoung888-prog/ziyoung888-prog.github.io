<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PLC control logic and motor starter workflow</title>
  <desc id="desc">A stylised PLC workflow diagram showing communication setup, I/O mapping, ladder logic and star-delta motor starting control.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f2a31"/>
      <stop offset="1" stop-color="#071015"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#70f5dd"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#071015"/>
  <path d="M0 110h1200M0 240h1200M0 370h1200M0 500h1200M0 630h1200M120 0v760M300 0v760M480 0v760M660 0v760M840 0v760M1020 0v760" stroke="#7ef7d7" stroke-opacity=".08"/>
  <rect x="70" y="70" width="1060" height="620" rx="18" fill="url(#panel)" stroke="#7ef7d7" stroke-opacity=".38"/>
  <text x="100" y="130" fill="#70f5dd" font-family="Consolas, monospace" font-size="28" font-weight="700">PLC CONTROL LOGIC WORKFLOW</text>
  <text x="100" y="166" fill="#b8c9cb" font-family="Segoe UI, sans-serif" font-size="18">Communication setup -> I/O mapping -> ladder logic -> motor starting sequence</text>

  <g transform="translate(100 230)">
    <rect width="210" height="140" rx="14" fill="#0b1f26" stroke="#70f5dd" stroke-opacity=".5"/>
    <text x="24" y="38" fill="#ffc857" font-family="Consolas, monospace" font-size="17" font-weight="700">STAGE 1</text>
    <text x="24" y="70" fill="#eefcf8" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">PC - PLC</text>
    <text x="24" y="101" fill="#b8c9cb" font-family="Segoe UI, sans-serif" font-size="16">IP setup</text>
    <text x="24" y="124" fill="#b8c9cb" font-family="Segoe UI, sans-serif" font-size="16">Program download</text>
  </g>
  <g transform="translate(365 230)">
    <rect width="210" height="140" rx="14" fill="#0b1f26" stroke="#70f5dd" stroke-opacity=".5"/>
    <text x="24" y="38" fill="#ffc857" font-family="Consolas, monospace" font-size="17" font-weight="700">STAGE 2</text>
    <text x="24" y="70" fill="#eefcf8" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">I/O Mapping</text>
    <text x="24" y="101" fill="#b8c9cb" font-family="Segoe UI, sans-serif" font-size="16">I0.x inputs</text>
    <text x="24" y="124" fill="#b8c9cb" font-family="Segoe UI, sans-serif" font-size="16">Q0.x outputs</text>
  </g>
  <g transform="translate(630 230)">
    <rect width="210" height="140" rx="14" fill="#0b1f26" stroke="#70f5dd" stroke-opacity=".5"/>
    <text x="24" y="38" fill="#ffc857" font-family="Consolas, monospace" font-size="17" font-weight="700">STAGE 3</text>
    <text x="24" y="70" fill="#eefcf8" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Ladder Logic</text>
    <text x="24" y="101" fill="#b8c9cb" font-family="Segoe UI, sans-serif" font-size="16">Contacts / coils</text>
    <text x="24" y="124" fill="#b8c9cb" font-family="Segoe UI, sans-serif" font-size="16">Timers / counters</text>
  </g>
  <g transform="translate(895 230)">
    <rect width="210" height="140" rx="14" fill="#0b1f26" stroke="#70f5dd" stroke-opacity=".5"/>
    <text x="24" y="38" fill="#ffc857" font-family="Consolas, monospace" font-size="17" font-weight="700">STAGE 4</text>
    <text x="24" y="70" fill="#eefcf8" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Motor Start</text>
    <text x="24" y="101" fill="#b8c9cb" font-family="Segoe UI, sans-serif" font-size="16">Star to delta</text>
    <text x="24" y="124" fill="#b8c9cb" font-family="Segoe UI, sans-serif" font-size="16">Stop protection</text>
  </g>

  <path d="M310 300h55M575 300h55M840 300h55" stroke="url(#line)" stroke-width="4" filter="url(#glow)"/>
  <path d="M352 288l13 12-13 12M617 288l13 12-13 12M882 288l13 12-13 12" fill="none" stroke="#ffc857" stroke-width="4"/>

  <g transform="translate(160 455)" stroke="#70f5dd" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0h110"/>
    <path d="M0 70h110"/>
    <path d="M28 -20v110M82 -20v110"/>
    <path d="M160 0h90"/>
    <path d="M160 70h90"/>
    <circle cx="285" cy="35" r="35" stroke="#ffc857"/>
    <path d="M250 35h-30M320 35h48"/>
  </g>
  <text x="160" y="585" fill="#b8c9cb" font-family="Consolas, monospace" font-size="18">LD I0.1   TON T37,50   = Q0.0</text>

  <g transform="translate(650 455)" fill="none" stroke="#70f5dd" stroke-width="4" stroke-linecap="round">
    <path d="M0 0h390"/>
    <path d="M0 60h390"/>
    <path d="M0 120h390"/>
    <path d="M72 -12v24M108 -12v24M210 -12v24M246 -12v24"/>
    <path d="M72 48v24M108 48v24M210 48v24M246 48v24"/>
    <path d="M72 108v24M108 108v24M210 108v24M246 108v24"/>
    <circle cx="430" cy="60" r="48" stroke="#ffc857"/>
    <path d="M390 60h-8M478 60h30"/>
  </g>
  <text x="650" y="625" fill="#b8c9cb" font-family="Consolas, monospace" font-size="18">KM1 + KM4 -> 5s -> KM3</text>
  <text x="100" y="662" fill="#91a9ad" font-family="Segoe UI, sans-serif" font-size="15">Academic laboratory project: PLC communication, I/O allocation, ladder instructions and star-delta motor control analysis.</text>
</svg>
