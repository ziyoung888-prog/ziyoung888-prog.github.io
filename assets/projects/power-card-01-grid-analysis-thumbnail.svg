<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Power systems analysis diagram</title>
  <desc id="desc">Stylised transmission network with buses, generators, loads, dispatch and voltage control indicators.</desc>
  <rect width="1200" height="600" fill="#071015"/>
  <g opacity="0.38" stroke="#70f5dd" stroke-width="1">
    <path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200"/>
    <path d="M120 0v600M240 0v600M360 0v600M480 0v600M600 0v600M720 0v600M840 0v600M960 0v600M1080 0v600"/>
  </g>
  <g stroke="#70f5dd" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M210 170 450 115 690 200 940 140"/>
    <path d="M210 170 320 365 600 430 940 140"/>
    <path d="M450 115 600 430 870 380"/>
    <path d="M690 200 870 380"/>
  </g>
  <g stroke="#ffc857" stroke-width="5" fill="#0f242c">
    <circle cx="210" cy="170" r="44"/>
    <circle cx="450" cy="115" r="44"/>
    <circle cx="690" cy="200" r="44"/>
    <circle cx="940" cy="140" r="44"/>
    <circle cx="320" cy="365" r="44"/>
    <circle cx="600" cy="430" r="44"/>
    <circle cx="870" cy="380" r="44"/>
  </g>
  <g font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <g fill="#eefcf8" font-size="26">
      <text x="210" y="179">B1</text>
      <text x="450" y="124">B2</text>
      <text x="690" y="209">B3</text>
      <text x="940" y="149">B4</text>
      <text x="320" y="374">B6</text>
      <text x="600" y="439">B7</text>
      <text x="870" y="389">B10</text>
    </g>
    <g fill="#70f5dd" font-size="20">
      <text x="210" y="78">Slack / PV / PQ</text>
      <text x="690" y="86">PowerWorld</text>
      <text x="600" y="535">MATLAB dispatch</text>
      <text x="900" y="485">Voltage control</text>
    </g>
  </g>
  <g>
    <rect x="64" y="470" width="258" height="72" rx="4" fill="#0f242c" stroke="#70f5dd" stroke-width="2"/>
    <rect x="370" y="470" width="258" height="72" rx="4" fill="#0f242c" stroke="#70f5dd" stroke-width="2"/>
    <rect x="676" y="470" width="258" height="72" rx="4" fill="#0f242c" stroke="#70f5dd" stroke-width="2"/>
    <text x="193" y="502" fill="#ffc857" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">Load Flow</text>
    <text x="193" y="528" fill="#bdd4d5" font-family="Consolas, monospace" font-size="16" text-anchor="middle">bus voltage + line limits</text>
    <text x="499" y="502" fill="#ffc857" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">Fault Level</text>
    <text x="499" y="528" fill="#bdd4d5" font-family="Consolas, monospace" font-size="16" text-anchor="middle">short-circuit + protection</text>
    <text x="805" y="502" fill="#ffc857" font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">Secure Dispatch</text>
    <text x="805" y="528" fill="#bdd4d5" font-family="Consolas, monospace" font-size="16" text-anchor="middle">cost vs network constraints</text>
  </g>
</svg>
